<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
:root{color-scheme:dark;--f:-apple-system,"SF Pro Display","Inter","Roboto",Arial,sans-serif;--g:rgba(255,255,255,.1);--gb:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#07080c;font-family:var(--f);color:#fff;overflow:hidden}
.tv{position:absolute;inset:0;font-size:min(1.25vw,2.2vh);background:#07080c}
.bg,.wp{position:absolute;inset:0}
.bg svg{width:100%;height:100%;display:block}
.wp{background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s}
.wp.on{opacity:1}
.bgs{position:absolute;inset:0;background:linear-gradient(rgba(7,8,12,.15),rgba(7,8,12,.78) 70%)}
.sc{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.ct{position:relative;padding:2em 0 4em}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 5em;margin-bottom:1.2em}
.wxl{display:flex;flex-direction:column;gap:.1em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.wt{font-size:3.4em;font-weight:500;letter-spacing:-.03em;line-height:1}
.wc{font-size:1.4em;opacity:.85;font-weight:500}
.clk{text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.time{font-size:7.5em;font-weight:600;line-height:1;letter-spacing:-.04em;color:#fff}
.date{font-size:1.4em;opacity:.85;margin-top:.2em;font-weight:500}
.ic{justify-self:end;display:flex;gap:.8em}
.cb{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;background:var(--g);border:1px solid var(--gb)}
.cb svg{width:1.2em;height:1.2em;transition:opacity .3s}.cb.off svg{opacity:.3}
.hero{margin:0 5em;height:16em;border-radius:1.8em;position:relative;overflow:hidden;background:#1a2036 center/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,12,.88),transparent 65%)}
.hi{position:absolute;z-index:2;left:2.4em;bottom:2em}
.tag{font-size:.9em;opacity:.7;font-weight:500}
.ht{font-size:3em;font-weight:600;letter-spacing:-.02em;margin:.1em 0 .4em;max-width:16em}
.pl{display:inline-block;padding:.5em 1.6em;border-radius:99px;background:rgba(255,255,255,.9);color:#000;font-weight:600}
.lbl{font-size:1.25em;font-weight:600;margin:1.8em 5em .7em;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.row{display:flex;gap:1.2em;overflow:hidden;padding:.6em 5em}
.t{flex:none;border-radius:1.1em;position:relative;overflow:hidden;background:#1a1d26 center/cover no-repeat}
.b{width:17em;aspect-ratio:16/9;display:grid;place-items:center;font-weight:600;font-size:1.2em;text-align:center;padding:.4em}
.b.ico{background-size:auto 48%;background-position:center 35%}
.lb{position:absolute;left:.5em;right:.5em;bottom:.5em;font-size:.8em;font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p{width:10.5em;aspect-ratio:2/3}
.p span{position:absolute;left:.8em;right:.8em;bottom:.8em;font-weight:600;font-size:.95em;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.p:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65))}
.c{width:11em;height:5.5em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;background:var(--g);border:1px solid var(--gb);font-weight:500;text-align:center}
.c i{font-style:normal;font-size:1.5em}
.sub{font-size:.9em;opacity:.6;padding:1em 0}
.nt{transition:none!important}.bubble{position:absolute;left:0;top:0;z-index:5;pointer-events:none;will-change:transform,width,height;border:2px solid var(--gc,rgba(200,210,255,.9));background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,0) 60%);box-shadow:0 0 2.2em var(--gc,rgba(200,210,255,.6));transition:transform .45s cubic-bezier(.34,1.35,.5,1),width .45s cubic-bezier(.34,1.35,.5,1),height .45s cubic-bezier(.34,1.35,.5,1),border-color .3s}
</style>
</head>
<body>
<div class="tv">
<div class="bg"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213f"/><stop offset=".5" stop-color="#6d5788"/><stop offset="1" stop-color="#f4a67c"/></linearGradient>
<radialGradient id="sn"><stop offset="0" stop-color="#fff0c8"/><stop offset=".25" stop-color="#ffc58a" stop-opacity=".8"/><stop offset="1" stop-color="#ff9a70" stop-opacity="0"/></radialGradient>
<linearGradient id="lk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6987a"/><stop offset="1" stop-color="#1d2347"/></linearGradient>
<path id="pn" d="M0,-120 L-34,-50 L-16,-50 L-46,10 L-20,10 L-54,70 L54,70 L20,10 L46,10 L16,-50 L34,-50Z"/></defs>
<rect width="1600" height="900" fill="url(#sk)"/>
<circle cx="1150" cy="440" r="260" fill="url(#sn)"/><circle cx="1150" cy="440" r="48" fill="#fff3d6"/>
<path d="M0,520 L180,400 L320,480 L520,330 L720,470 L900,380 L1100,500 L1300,390 L1600,520 L1600,900 L0,900Z" fill="#3d4b7c" opacity=".9"/>
<path d="M0,600 L200,500 L400,590 L650,460 L900,600 L1150,520 L1400,610 L1600,540 L1600,900 L0,900Z" fill="#2a3461"/>
<rect y="640" width="1600" height="260" fill="url(#lk)" opacity=".75"/>
<path d="M0,730 Q300,670 600,740 T1200,730 T1600,710 L1600,900 L0,900Z" fill="#101829"/>
<g fill="#0a1020"><use href="#pn" transform="translate(70 700) scale(1.5)"/><use href="#pn" transform="translate(190 730) scale(1.1)"/><use href="#pn" transform="translate(1530 700) scale(1.6)"/><use href="#pn" transform="translate(1410 735) scale(1.1)"/></g>
</svg></div>
<div class="wp" id="w0"></div><div class="wp" id="w1"></div>
<div class="bgs"></div>
<div class="sc" id="sc"><div class="ct" id="ct">
  <div class="hd">
    <div class="wxl"><div class="wt" id="wt">--&deg;</div><div class="wc">Chennai</div></div>
    <div class="clk"><div class="time" id="time"></div><div class="date" id="date"></div></div>
    <div class="ic">
      <div class="cb" id="wf" data-f data-act="wifi"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="#fff"/></svg></div>
      <div class="cb" data-f data-act="settings"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></div>
    </div>
  </div>
  <div id="heroBox"></div>
  <div id="rows"></div>
  <div class="bubble" id="bb"></div>
</div></div></div>
<script>
(function(){
var TMDB_KEY="";   /* paste your free TMDB API key between the quotes for movie and show posters */
var LAT=13.08,LON=80.27;
var A=window.Android;
function $(i){return document.getElementById(i)}
var cur=null,fs=[],apps=[],lastApps="",cache={},mov=[],shw=[],ins=[];
var PREF=/netflix|youtube|prime video|hotstar|spotify|disney|zee5|sony ?liv|jio/i;
var MOCK=[{pkg:"a",label:"Netflix"},{pkg:"b",label:"YouTube"},{pkg:"c",label:"Prime Video"},{pkg:"d",label:"Spotify"},{pkg:"e",label:"Chrome"},{pkg:"f",label:"Files"}];

/* ---- focus + liquid bubble (GPU transform, cheap on TV chips) ---- */
function setGlow(el){$("bb").style.setProperty("--gc",el.getAttribute("data-c")||"rgba(200,210,255,.9)")}
function place(el,instant){
  var bb=$("bb");
  if(instant)bb.classList.add("nt");
  var r=el.getBoundingClientRect(),c=$("ct").getBoundingClientRect(),p=8;
  var br=parseFloat(getComputedStyle(el).borderTopLeftRadius)||12;
  bb.style.width=(r.width+2*p)+"px";bb.style.height=(r.height+2*p)+"px";
  bb.style.borderRadius=Math.min(br+p,(r.height+2*p)/2)+"px";
  bb.style.transform="translate3d("+(r.left-c.left-p)+"px,"+(r.top-c.top-p)+"px,0)";
  if(instant){void bb.offsetWidth;bb.classList.remove("nt")}
}
function realign(){if(cur&&document.body.contains(cur))place(cur,true)}
function focus(el,instant){
  cur=el;setGlow(el);
  var row=el.parentNode&&el.parentNode.classList&&el.parentNode.classList.contains("row")?el.parentNode:null;
  if(row){var er=el.getBoundingClientRect(),rr=row.getBoundingClientRect(),m=rr.width*.08;
    if(er.right>rr.right-m)row.scrollLeft+=er.right-rr.right+m*2;
    else if(er.left<rr.left+m)row.scrollLeft-=rr.left+m*2-er.left}
  place(el,instant);
  var r=el.getBoundingClientRect(),sc=$("sc"),sr=sc.getBoundingClientRect();
  if(r.bottom>sr.bottom-50)sc.scrollTop+=r.bottom-sr.bottom+90;
  else if(r.top<sr.top+50)sc.scrollTop-=sr.top-r.top+90;
}
function focusFirst(){var t=document.querySelector(".row .t")||fs[0];if(t)focus(t,true)}
function move(dx,dy){
  var c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2,best=null,bs=1e9;
  fs.forEach(function(el){if(el===cur)return;var r=el.getBoundingClientRect(),x=r.left+r.width/2-cx,y=r.top+r.height/2-cy;
    var al=dx?x*dx:y*dy,cr=dx?Math.abs(y):Math.abs(x);if(al<=4)return;
    var s=al+cr*2.2;if(s<bs){bs=s;best=el}});
  if(best)focus(best);
}
function collect(){
  fs=[].slice.call(document.querySelectorAll("[data-f]"));
  fs.forEach(function(el){if(!el._h){el._h=1;
    el.addEventListener("mouseenter",function(){focus(el)});
    el.addEventListener("click",function(){act(el)})}});
}
function act(el){
  var d=el.dataset;if(!A)return;
  if(d.pkg)A.launch(d.pkg);
  else if(d.q)A.openUrl("https://www.youtube.com/results?search_query="+encodeURIComponent(d.q+" trailer"));
  else if(d.inp)A.startInput(d.inp);
  else if(d.act==="wifi")A.openSettings("wifi");
  else if(d.act==="settings")A.openSettings("all");
  else if(d.act==="all"){var g=document.querySelector("[data-allrow]");if(g&&g.firstChild)focus(g.firstChild)}
}
document.addEventListener("keydown",function(e){
  var k={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[e.key];
  if(k){e.preventDefault();if(!cur)focusFirst();else move(k[0],k[1]);return}
  if(e.key==="Enter"||e.keyCode===23){e.preventDefault();if(cur)act(cur)}
});
window.addEventListener("resize",function(){if(cur)focus(cur,true)});

/* ---- glow color taken from each app's own icon ---- */
function glow(el,url){
  var im=new Image();
  im.onload=function(){try{
    var c=document.createElement("canvas");c.width=c.height=16;var x=c.getContext("2d");x.drawImage(im,0,0,16,16);
    var d=x.getImageData(0,0,16,16).data,r=0,g=0,b=0,w=0;
    for(var i=0;i<d.length;i+=4){if(d[i+3]<128)continue;var R=d[i],G=d[i+1],B=d[i+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B),s=mx?(mx-mn)/mx:0,wt=s*s*(mx/255)+.01;r+=R*wt;g+=G*wt;b+=B*wt;w+=wt}
    if(!w)return;r/=w;g/=w;b/=w;var m=Math.max(r,g,b);if(m<30)return;var k=255/m;
    el.setAttribute("data-c","rgb("+Math.round(r*k)+","+Math.round(g*k)+","+Math.round(b*k)+")");
    if(cur===el)setGlow(el);
  }catch(e){}};
  im.src=url;
}

/* ---- rows ---- */
function paint(el,a,i){
  setTimeout(function(){
    var r=cache[a.pkg];
    if(r===undefined){try{r=A?A.getIcon(a.pkg,true):""}catch(e){r=""}cache[a.pkg]=r}
    if(r){var url=r.slice(2);el.style.backgroundImage="url("+url+")";
      if(r.charAt(0)!=="b"){el.classList.add("ico");var s=document.createElement("span");s.className="lb";s.textContent=a.label;el.appendChild(s)}
      glow(el,url)}
    else el.textContent=a.label;
  },i*20);
}
function rowEl(title){
  var l=document.createElement("div");l.className="lbl";l.textContent=title;
  var r=document.createElement("div");r.className="row";
  $("rows").appendChild(l);$("rows").appendChild(r);return r;
}
function appTile(a,i){var d=document.createElement("div");d.className="t b";d.setAttribute("data-f","");d.dataset.pkg=a.pkg;paint(d,a,i);return d}
function poster(m){
  var d=document.createElement("div");d.className="t p";d.setAttribute("data-f","");d.dataset.q=m.title;
  if(m.poster_path)d.style.backgroundImage="url(https://image.tmdb.org/t/p/w342"+m.poster_path+")";
  var s=document.createElement("span");s.textContent=m.title;d.appendChild(s);return d;
}
function chip(icon,label,attr,val){
  var d=document.createElement("div");d.className="t c";d.setAttribute("data-f","");d.setAttribute(attr,val);
  d.innerHTML="<i>"+icon+"</i>";var s=document.createElement("span");s.textContent=label;d.appendChild(s);return d;
}
function buildHero(){
  var h=$("heroBox");h.innerHTML="";
  if(!mov.length||!mov[0].backdrop_path)return;
  var m=mov[0],d=document.createElement("div");d.className="hero";d.setAttribute("data-f","");d.dataset.q=m.title;
  d.style.backgroundImage="url(https://image.tmdb.org/t/p/w1280"+m.backdrop_path+")";
  d.innerHTML='<div class="hi"><div class="tag">Trending today</div><div class="ht"></div><span class="pl">\u25B6 Trailer</span></div>';
  d.querySelector(".ht").textContent=m.title;h.appendChild(d);
}
var ORDER=[/^youtube$/i,/netflix/i,/prime video/i,/hotstar|jio/i,/spotify/i,/disney/i,/zee5/i,/sony ?liv/i,/youtube/i];
function rank(a){for(var i=0;i<ORDER.length;i++)if(ORDER[i].test(a.label))return i;return PREF.test(a.label)?50:99}
function buildRows(){
  $("rows").innerHTML="";buildHero();
  var pref=[],rest=[];apps.forEach(function(a){(PREF.test(a.label)?pref:rest).push(a)});
  var fav=(pref.length?pref:apps).map(function(a,i){return{a:a,i:i}}).sort(function(x,y){return rank(x.a)-rank(y.a)||x.i-y.i}).map(function(o){return o.a}).slice(0,10);
  var r1=rowEl("Your apps");fav.forEach(function(a,i){r1.appendChild(appTile(a,i))});
  if(mov.length){var r2=rowEl("Trending movies");mov.slice(0,12).forEach(function(m){r2.appendChild(poster(m))})}
  if(shw.length){var r3=rowEl("Trending shows");shw.slice(0,12).forEach(function(m){r3.appendChild(poster(m))})}
  var r4=rowEl("All apps");r4.setAttribute("data-allrow","1");apps.forEach(function(a,i){r4.appendChild(appTile(a,i+10))});
  var r5=rowEl("Inputs & shortcuts");
  ins.slice(0,5).forEach(function(x){r5.appendChild(chip("&#9644;",x.label,"data-inp",x.id))});
  r5.appendChild(chip("&#8942;&#8942;","All Apps","data-act","all"));
  r5.appendChild(chip("&#128246;","Wi-Fi","data-act","wifi"));
  r5.appendChild(chip("&#9881;","Settings","data-act","settings"));
  collect();
  if(!cur||!document.body.contains(cur))focusFirst();
}
function refreshApps(){
  var s;try{s=A?A.getApps():JSON.stringify(MOCK)}catch(e){s="[]"}
  var l=[];try{l=A?JSON.parse(A.getInputs()):[]}catch(e){}
  var sig=s+JSON.stringify(l);
  if(sig===lastApps)return;lastApps=sig;
  apps=JSON.parse(s);ins=l;buildRows();
}

/* ---- clock, wifi ---- */
function tick(){
  var d=new Date(),h=d.getHours()%12||12,m=("0"+d.getMinutes()).slice(-2);
  $("time").textContent=h+":"+m;
  $("date").textContent=d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
  var n="wifi";try{if(A)n=A.getNet()}catch(e){}
  $("wf").classList.toggle("off",n==="none");
}

/* ---- weather (Open-Meteo) ---- */
function wxIcon(c){return c===0?"\u2600\uFE0F":c<3?"\u26C5":c<4?"\u2601\uFE0F":c<50?"\uD83C\uDF2B\uFE0F":c<70?"\uD83C\uDF27\uFE0F":c<80?"\u2744\uFE0F":c<95?"\uD83C\uDF26\uFE0F":"\u26C8\uFE0F"}
function weather(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current=temperature_2m,weather_code&timezone=auto")
  .then(function(r){return r.json()}).then(function(j){
    $("wt").textContent=wxIcon(j.current.weather_code)+" "+Math.round(j.current.temperature_2m)+"\u00B0";
  }).catch(function(){});
}

/* ---- movies and shows (TMDB, optional) ---- */
function tmdb(){
  if(!TMDB_KEY)return;
  fetch("https://api.themoviedb.org/3/trending/movie/day?api_key="+TMDB_KEY).then(function(r){return r.json()})
  .then(function(j){mov=j.results||[];buildRows()}).catch(function(){});
  fetch("https://api.themoviedb.org/3/trending/tv/day?api_key="+TMDB_KEY).then(function(r){return r.json()})
  .then(function(j){shw=(j.results||[]).map(function(x){return{title:x.name,poster_path:x.poster_path}});buildRows()}).catch(function(){});
}

/* ---- nature wallpapers from assets/wallpapers ---- */
var wl=[],wi=0,wf=0;
function nextWp(){
  var n=$("w"+(1-wf)),o=$("w"+wf),u=wl[wi];wi=(wi+1)%wl.length;
  var im=new Image();im.onload=function(){n.style.backgroundImage="url("+u+")";n.classList.add("on");o.classList.remove("on");wf=1-wf};im.src=u;
}
function wallpapers(){
  try{wl=A?JSON.parse(A.getWallpapers()):[]}catch(e){wl=[]}
  if(!wl.length)return;
  nextWp();if(wl.length>1)setInterval(nextWp,30000);
}

window.refreshAll=function(){refreshApps();tick()};
window.goHome=function(){$("sc").scrollTop=0;refreshAll();focusFirst()};
if(window.ResizeObserver)new ResizeObserver(realign).observe($("ct"));
window.addEventListener("load",realign);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(realign);
[400,1200,3000].forEach(function(t){setTimeout(realign,t)});
refreshAll();weather();tmdb();wallpapers();
setInterval(tick,10000);setInterval(weather,900000);setInterval(tmdb,3600000);
})();
</script>
</body>
</html>
